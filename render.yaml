services:
  - type: web
    name: knot-url-shortener-api
    runtime: docker
    plan: free
    dockerfilePath: ./loadbalancer/Dockerfile
    dockerContext: ./loadbalancer
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false