worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
    limit_req_status 429;

    upstream spring_app {
        # An instance that fails twice is taken out of rotation for 10s, so a dead
        # or restarting backend costs one fast retry instead of every request.
        server 127.0.0.1:8081 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8082 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8083 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8084 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 9090;
        server_name localhost;

        # Inherited by every location below that doesn't override them
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # Try the next instance when one refuses/drops the connection. Non-idempotent
        # requests (POST/DELETE) are only retried if they never reached the backend.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;

        add_header X-Upstream-Server $upstream_addr always;

        default_type application/json;

        error_page 429 @rate_limited;
        location @rate_limited {
            return 429 '{"message": "Request blocked by load balancer: rate limit exceeded, please try again later."}';
        }

        error_page 502 503 504 @upstream_down;
        location @upstream_down {
            return 503 '{"message": "Service temporarily unavailable, please try again shortly."}';
        }

        # POST /shorten - create a short link
        location = /shorten {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://spring_app;
        }

        # Load balancer health check - UP if at least one backend reports healthy
        location = /health {
            access_log off;
            proxy_pass http://spring_app/actuator/health;
        }

        # GET/DELETE /api/links, GET /api/analytics/daily - recent links + analytics
        location /api/ {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://spring_app;
        }

        # GET /{code} - short link redirect, e.g. /m, /launch (single path segment)
        location ~ ^/[^/]+$ {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://spring_app;
        }

        location / {
            return 404 '{"message": "Not found."}';
        }
    }
}
