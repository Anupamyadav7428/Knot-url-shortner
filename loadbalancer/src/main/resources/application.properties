spring.application.name=loadbalancer

# Every environment-specific value can be overridden with an environment
# variable (e.g. DB_PASSWORD) so secrets never need to be edited into this file.
# The defaults after the colon are for local development only.
# A .env file in the working directory (KEY=VALUE per line) is loaded too.
spring.config.import=optional:file:./.env[.properties]

# Public URL that short links are built from (the nginx load balancer, not an app port)
app.base-url=${APP_BASE_URL:http://localhost:9090/}
# Comma-separated list of origins allowed to call the API from a browser
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

server.port=${SERVER_PORT:8080}
# Finish in-flight requests before exiting, so a rolling restart drops nothing
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Trust X-Forwarded-* headers from nginx
server.forward-headers-strategy=native

# /actuator/health is what nginx (/health) and lb.ps1 use to decide an instance is up.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Redis is a best-effort cache (see ShortUrlService) - an outage must not mark the
# instance unhealthy and pull it out of rotation.
management.health.redis.enabled=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
