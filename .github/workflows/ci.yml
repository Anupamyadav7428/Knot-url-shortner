name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run that's still going
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: loadbalancer

    services:
      # The Spring context test connects to Postgres on startup
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: appdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d appdb"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/appdb
      DB_USERNAME: postgres
      DB_PASSWORD: ci-password
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Apply database schema
        env:
          PGPASSWORD: ci-password
        run: psql -h 127.0.0.1 -U postgres -d appdb -v ON_ERROR_STOP=1 -f migration_postgres.sql

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: loadbalancer/build/reports/tests/
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: loadbalancer/build/libs/*-SNAPSHOT.jar
          retention-days: 7

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs
      - name: Allow headless Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Production build
        run: npx ng build --configuration production

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/
          retention-days: 7

  nginx:
    name: Nginx config check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: nginx -t
        run: |
          docker run --rm \
            -v "$PWD/loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:stable nginx -t -c /etc/nginx/nginx.conf

  scripts:
    name: lb.ps1 syntax check
    # Windows PowerShell 5.1 is what lb.ps1 targets
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse lb.ps1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\loadbalancer\lb.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error file=loadbalancer/lb.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            exit 1
          }
          Write-Host "lb.ps1 parses cleanly"